<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة علوم المختبرات الطبية | Medical Lab Portal</title>
<meta name="description" content="دليل مرجعي ثنائي اللغة لأكثر من 400 فحص مخبرياً: نوع العينة، القيم المرجعية، الاستخدامات، ترتيب سحب العينات، أخطاء ما قبل التحليل، وحاسبات مخبرية تفاعلية ومرجع سريع، ومعايير السلامة. إعداد أ. مأمون السعودي.">
<meta property="og:title" content="بوابة علوم المختبرات الطبية | Medical Lab Portal">
<meta property="og:description" content="دليل الفحوصات المخبرية، ترتيب سحب العينات، والسلامة المهنية — بالعربي والإنجليزي.">
<meta property="og:image" content="https://mam87.github.io/labmagazine/assets/order-of-draw.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f33">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230e7c7b'/><path d='M26 14h12v4h-2v14l10 16a4 4 0 0 1-3.4 6H21.4A4 4 0 0 1 18 48l10-16V18h-2z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7f9;--surface:#ffffff;--surface-2:#eef3f6;--ink:#0b1f33;--ink-2:#46596b;--ink-3:#7a8b9a;
  --line:#dde5eb;--brand:#0e7c7b;--brand-ink:#ffffff;--brand-soft:#e0f2f1;--accent:#c2410c;
  --warn-bg:#fff7ed;--warn-line:#fed7aa;--warn-ink:#9a3412;
  --radius:16px;--shadow:0 1px 2px rgba(11,31,51,.06),0 4px 16px rgba(11,31,51,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a141d;--surface:#111e2a;--surface-2:#172836;--ink:#e8eef3;--ink-2:#a9b8c5;--ink-3:#7d8fa0;
  --line:#22364a;--brand:#2bb3a8;--brand-ink:#04211f;--brand-soft:#0f2f30;--accent:#fb923c;
  --warn-bg:#2a1a0d;--warn-line:#5a3412;--warn-ink:#fdba74;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0a141d;--surface:#111e2a;--surface-2:#172836;--ink:#e8eef3;--ink-2:#a9b8c5;--ink-3:#7d8fa0;
  --line:#22364a;--brand:#2bb3a8;--brand-ink:#04211f;--brand-soft:#0f2f30;--accent:#fb923c;
  --warn-bg:#2a1a0d;--warn-line:#5a3412;--warn-ink:#fdba74;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none;font-size:15px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo i svg{width:18px;height:18px;fill:var(--brand-ink)}
.top .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--brand)}
/* hero */
.hero{padding:48px 0 28px}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
.hero h1{font-size:clamp(30px,5.5vw,52px);line-height:1.15;margin:16px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--brand)}
.hero p.lead{color:var(--ink-2);font-size:clamp(16px,2.2vw,19px);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
/* tabs */
.tabs{position:sticky;top:62px;z-index:15;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pane{display:none;padding:28px 0 56px}
.pane.on{display:block}
h2{font-size:clamp(22px,3.2vw,28px);margin-bottom:6px}
.sub{color:var(--ink-2);margin-bottom:20px}
/* search */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 46px 14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
[dir="ltr"] .search input{padding:14px 16px 14px 46px}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:16px;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip small{opacity:.7;margin-inline-start:4px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.count{font-size:13px;color:var(--ink-3);margin-bottom:10px}
/* test list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;direction:ltr;text-align:left}
.card h3{font-size:15.5px;line-height:1.35}
.card .cat{font-size:11.5px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.row .k{color:var(--ink-3);min-width:62px;font-size:12px}
.row .v{color:var(--ink)}
.tube{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.ref{font-variant-numeric:tabular-nums;font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:40px}
.more{display:block;margin:18px auto 0;padding:11px 22px}
/* sections */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.box h3{font-size:17px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.box p,.box li{color:var(--ink-2);font-size:14.5px}
.box ul{padding-inline-start:18px;display:grid;gap:6px}
.num{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
/* order of draw */
.draw{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 24px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.step .cap{width:34px;height:14px;border-radius:6px 6px 2px 2px;margin:0 auto}
.step .body{width:26px;height:46px;margin:0 auto 10px;border-radius:0 0 13px 13px;background:linear-gradient(var(--surface-2),var(--surface-2));border:1px solid var(--line);border-top:0}
.step b{display:block;font-size:14px}
.step small{display:block;color:var(--ink-3);font-size:12px;line-height:1.45;margin-top:4px}
.step .n{font-size:11px;font-weight:700;color:var(--brand)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gallery figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.gallery img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:var(--surface-2)}
.gallery figcaption{padding:10px 14px;font-size:13.5px;font-weight:600}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,720px)}
dialog::backdrop{background:rgba(5,12,20,.8)}
dialog img{width:100%;border-radius:12px;display:block}
/* waste */
.waste{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bin{border-radius:var(--radius);padding:16px;border:1px solid var(--line);background:var(--surface);border-top:6px solid var(--c)}
.bin b{display:block;margin-bottom:4px}
.bin p{font-size:13.5px;color:var(--ink-2)}
/* resources */
.res a{text-decoration:none;color:inherit;display:block;height:100%}
.res .box{height:100%;transition:border-color .15s}
.res .box:hover{border-color:var(--brand)}
.res .dom{font-size:12px;color:var(--brand);font-weight:600;direction:ltr}
/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer .links{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* calculators */
.calcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.calc h3{font-size:16.5px}
.calc .f{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;line-height:1.5}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-3)}
.fld input,.fld select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.out{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res span{font-size:13px;color:var(--ink-2)}
.res b{font-size:20px;font-variant-numeric:tabular-nums;direction:ltr}
.res b small{font-size:12px;font-weight:500;color:var(--ink-3);margin-inline-start:4px}
.flag{font-size:13px;border-radius:8px;padding:7px 10px;background:var(--brand-soft);color:var(--brand)}
.flag.w{background:var(--warn-bg);color:var(--warn-ink)}
.muted{font-size:13px;color:var(--ink-3)}
.src{margin-top:22px;font-size:12.5px;color:var(--ink-3)}
/* quick reference */
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.refsec{margin-bottom:30px;scroll-margin-top:130px}
.refsec h3.t{font-size:19px;margin-bottom:4px}
.refsec p.d{color:var(--ink-2);font-size:14.5px;margin-bottom:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:5px solid var(--c,var(--brand))}
.rc b{display:block;font-size:15px;margin-bottom:4px}
.rc .code{direction:ltr;display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);border-radius:6px;padding:1px 7px;margin-bottom:6px}
.rc ul{list-style:none;display:grid;gap:3px;font-size:13.5px;color:var(--ink-2)}
.rc li span{color:var(--ink-3)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.tag.rej{background:#fee2e2;color:#991b1b}.tag.wrn{background:var(--warn-bg);color:var(--warn-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.rej{background:#3b1414;color:#fca5a5}}
:root[data-theme="dark"] .tag.rej{background:#3b1414;color:#fca5a5}

/* encyclopedia */
.card.has{cursor:pointer;transition:border-color .15s,transform .15s}
.card.has:hover{border-color:var(--brand)}
.card.has:active{transform:scale(.99)}
.more-link{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--brand);direction:rtl;text-align:right}
[dir="ltr"] .more-link{direction:ltr;text-align:left}
.encbadge{font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 8px;margin-inline-start:6px}
#sheet{border:0;padding:0;margin:auto;width:min(760px,100vw);max-width:100vw;max-height:92vh;border-radius:20px;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#sheet::backdrop{background:rgba(5,12,20,.6)}
@media (max-width:600px){#sheet{margin:auto 0 0;width:100vw;max-height:94vh;border-radius:20px 20px 0 0}}
.sh{padding:0 0 28px}
.sh-top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px 14px;display:flex;gap:12px;align-items:flex-start;z-index:1}
.sh-top h2{font-size:20px;line-height:1.3;direction:ltr;text-align:left;flex:1;margin:0}
.sh-top .cat{font-size:11.5px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;direction:ltr;text-align:left}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.sh-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 20px 4px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact small{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.fact div{font-size:13.5px;font-weight:600;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.sh-sec{padding:14px 20px 0}
.sh-sec h4{font-size:14px;color:var(--brand);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.sh-sec p{font-size:15px;color:var(--ink);line-height:1.8}
.sh-sec ul{padding-inline-start:20px;display:grid;gap:5px;font-size:14.5px;color:var(--ink);line-height:1.7}
.sh-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 0}
.sh-two .box{padding:14px 16px}
.sh-two .box h4{font-size:14px;margin-bottom:6px}
.up h4{color:#c2410c}.down h4{color:#2563eb}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel button{direction:ltr}
.sh-foot{padding:18px 20px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
@media (max-width:600px){.sh-facts{grid-template-columns:1fr}.sh-two{grid-template-columns:1fr}}
@media (max-width:900px){.draw{grid-template-columns:repeat(3,1fr)}.waste,.grid3,.gallery{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid2,.grid3,.gallery,.waste{grid-template-columns:1fr}.draw{grid-template-columns:1fr 1fr}.hero{padding-top:32px}.logo span{display:none}.list{grid-template-columns:1fr}}
@media print{.top,.tabs,footer,.more{display:none}.pane{display:block!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#"><i><svg viewBox="0 0 24 24"><path d="M9 2h6v2h-1v6.5l5.6 8.9A2 2 0 0 1 17.9 22H6.1a2 2 0 0 1-1.7-2.6L10 10.5V4H9z"/></svg></i><span data-t="brand"></span></a>
  <div class="sp"></div>
  <button class="pill" id="themeBtn" aria-label="theme" style="display:grid;place-items:center;width:36px;height:36px;padding:0"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="pill" id="langBtn">English</button>
</div></header>

<section class="hero"><div class="wrap">
  <span class="eyebrow" data-t="eyebrow"></span>
  <h1 data-t="h1" data-html></h1>
  <p class="lead" data-t="lead"></p>
  <div class="stats">
    <div class="stat"><b id="statTests">—</b><span data-t="sTests"></span></div>
    <div class="stat"><b id="statCats">—</b><span data-t="sCats"></span></div>
    <div class="stat"><b>6</b><span data-t="sTubes"></span></div>
    <div class="stat"><b>ISO 15189</b><span data-t="sStd"></span></div>
  </div>
</div></section>

<nav class="tabs"><div class="wrap" role="tablist">
  <button class="tab" role="tab" data-pane="tests" aria-selected="true" data-t="tTests"></button>
  <button class="tab" role="tab" data-pane="calc" aria-selected="false" data-t="tCalc"></button>
  <button class="tab" role="tab" data-pane="pre" aria-selected="false" data-t="tPre"></button>
  <button class="tab" role="tab" data-pane="ref" aria-selected="false" data-t="tRef"></button>
  <button class="tab" role="tab" data-pane="safety" aria-selected="false" data-t="tSafety"></button>
  <button class="tab" role="tab" data-pane="res" aria-selected="false" data-t="tRes"></button>
</div></nav>

<main class="wrap">
<!-- TESTS -->
<section class="pane on" id="pane-tests" role="tabpanel">
  <h2 data-t="tTests"></h2>
  <p class="sub" data-t="testsSub"></p>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="note">⚠️ <span data-t="refNote"></span></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <button class="pill more" id="moreBtn" data-t="more"></button>
</section>

<!-- PRE-ANALYTICAL -->
<section class="pane" id="pane-pre" role="tabpanel">
  <h2 data-t="drawTitle"></h2>
  <p class="sub" data-t="drawSub"></p>
  <div class="draw" id="draw"></div>
  <h2 class="galsec" data-t="galTitle"></h2>
  <p class="sub galsec" data-t="galSub"></p>
  <div class="gallery galsec">
    <figure><img src="assets/order-of-draw.png" alt="Order of draw infographic" loading="lazy" onerror="this.closest('figure').remove();if(!document.querySelector('.gallery figure'))document.querySelectorAll('.galsec').forEach(e=>e.remove())"><figcaption data-t="g1"></figcaption></figure>
    <figure><img src="assets/preanalytical-errors.png" alt="Pre-analytical errors infographic" loading="lazy" onerror="this.closest('figure').remove();if(!document.querySelector('.gallery figure'))document.querySelectorAll('.galsec').forEach(e=>e.remove())"><figcaption data-t="g2"></figcaption></figure>
    <figure><img src="assets/waste-segregation.png" alt="Waste segregation infographic" loading="lazy" onerror="this.closest('figure').remove();if(!document.querySelector('.gallery figure'))document.querySelectorAll('.galsec').forEach(e=>e.remove())"><figcaption data-t="g3"></figcaption></figure>
  </div>

function lbl(x){ return typeof x === "string" ? x : x[lang]; }
function renderCalc(){
  const box = $("#calcs"); if (!box) return;
  box.innerHTML = CALCS.map(c => `<article class="calc" data-id="${c.id}">
    <h3>${c.t[lang]}</h3><div class="f">${c.f}</div>
    <div class="fields">${c.in.map(([k,l,u,d]) => {
      const key=c.id+"."+k, val = key in CV ? CV[key] : d;
      if (Array.isArray(d)) return `<label class="fld">${lbl(l)}<select data-k="${k}">${d.map(o=>`<option value="${o}" ${val===o?"selected":""}>${o==="M"?(lang==="ar"?"ذكر":"Male"):(lang==="ar"?"أنثى":"Female")}</option>`).join("")}</select></label>`;
      return `<label class="fld">${lbl(l)}${u?` <small>(${lbl(u)})</small>`:""}<input type="number" inputmode="decimal" step="any" data-k="${k}" value="${val}"></label>`;}).join("")}</div>
    <div class="out"></div></article>`).join("");
  box.querySelectorAll(".calc").forEach(updCalc);
}
function updCalc(el){
  const c = CALCS.find(x => x.id === el.dataset.id), v = {};
  el.querySelectorAll("[data-k]").forEach(i => { CV[c.id+"."+i.dataset.k] = i.value; v[i.dataset.k] = i.tagName === "SELECT" ? i.value : n(i.value); });
  let o = null; try { o = c.run(v); } catch(e) {}
  el.querySelector(".out").innerHTML = !o ? `<div class="muted">${lang==="ar"?"أدخل القيم المطلوبة":"Enter the required values"}</div>` :
    o.r.map(([k,val,u]) => `<div class="res"><span>${lbl(k)}</span><b>${val}<small>${u}</small></b></div>`).join("") +
    o.fl.map(([w,t]) => `<div class="flag ${w?"w":""}">${t[lang]}</div>`).join("");
}
document.addEventListener("input", e => { const el = e.target.closest(".calc"); if (el) updCalc(el); });

   {b:L2("وخز رضّي أم نزف تحت العنكبوتية؟","Traumatic tap vs SAH?"),c:"#6b7280",l:[L2("الوخز الرضّي: الدم يقل من الأنبوب 1 إلى 3","Traumatic tap: blood clears from tube 1 to 3"),L2("النزف: دم متساوٍ في الأنابيب + اصفرار (Xanthochromia) بعد التثفيل","SAH: even blood in all tubes + xanthochromia after spinning")]}
  ]},
 {id:"casts", t:L2("الأسطوانات البولية ودلالتها","Urinary Casts & Significance"),
  d:L2("تتكوّن في الأنابيب الكلوية من بروتين Tamm-Horsfall، لذا فوجودها يعني أن المصدر كلوي. تُفحص بالتكبير الصغير وبإضاءة منخفضة.","Formed in renal tubules from Tamm-Horsfall protein, so they localise the finding to the kidney. Scan under low power with reduced light."),
  items:[
   {b:L2("هيالينية — Hyaline","Hyaline"),c:"#94a3b8",l:[L2("أقلها أهمية؛ قد تظهر بعد الجهد أو الجفاف","Least significant; seen after exercise or dehydration")]},
   {b:L2("كريات حمراء — RBC","RBC cast"),c:"#dc2626",l:[L2("نزف كبيبي — التهاب كبيبات الكلى","Glomerular bleeding — glomerulonephritis")]},
   {b:L2("كريات بيضاء — WBC","WBC cast"),c:"#f59e0b",l:[L2("التهاب حويضة وكلية أو التهاب خلالي","Pyelonephritis or interstitial nephritis")]},
   {b:L2("خلايا ظهارية — Epithelial","Epithelial cast"),c:"#0ea5e9",l:[L2("أذية أنبوبية (نخر أنبوبي حاد، سموم)","Tubular injury (acute tubular necrosis, toxins)")]},
   {b:L2("حبيبية — Granular","Granular"),c:"#a16207",l:[L2("تحلل خلايا داخل أسطوانة؛ مرض كلوي","Degenerated cellular cast; renal disease")]},
   {b:L2("شمعية — Waxy","Waxy"),c:"#7c3aed",l:[L2("ركود طويل؛ فشل كلوي مزمن","Prolonged stasis; chronic renal failure")]},
   {b:L2("دهنية — Fatty","Fatty"),c:"#eab308",l:[L2("المتلازمة الكلوية (صليب مالطي بالضوء المستقطب)","Nephrotic syndrome (Maltese cross under polarised light)")]},
   {b:L2("عريضة — Broad","Broad"),c:"#111827",l:[L2("تتكوّن في أنابيب متوسعة؛ علامة إنذار سيئة","Formed in dilated tubules; poor prognostic sign")]}
  ]},
 {id:"crystals", t:L2("بلورات السائل الزلالي","Synovial Fluid Crystals"),
  d:L2("الطبيعي: لزج كبياض البيض، WBC < 200/µL، عدلات < 25%، بلا بلورات. يُفحص بالمجهر المستقطب مع المُعوِّض الأحمر.","Normal: viscous like egg white, WBC < 200/µL, neutrophils < 25%, no crystals. Examine with a polarising microscope and red compensator."),
  items:[
   {b:L2("يورات أحادية الصوديوم (MSU)","Monosodium urate (MSU)"),c:"#eab308",l:[L2("إبرية الشكل","Needle-shaped"),L2("انكسار مزدوج سالب قوي — أصفر عندما توازي محور المعوِّض","Strong negative birefringence — yellow when parallel to the compensator axis"),L2("النقرس (Gout)","Gout")]},
   {b:L2("بيروفوسفات الكالسيوم (CPPD)","Calcium pyrophosphate (CPPD)"),c:"#2563eb",l:[L2("معيّنية أو عصوية قصيرة","Rhomboid or short rods"),L2("انكسار مزدوج موجب ضعيف — أزرق عند التوازي","Weak positive birefringence — blue when parallel"),L2("النقرس الكاذب (Pseudogout)","Pseudogout")]},
   {b:L2("الكوليسترول","Cholesterol"),c:"#64748b",l:[L2("صفائح مسطحة بزاوية مكسورة","Flat plates with notched corner"),L2("انصبابات مزمنة (التهاب المفاصل الروماتويدي)","Chronic effusions (rheumatoid arthritis)")]}
  ]}
];
function renderRef(){
  const box = $("#refs"); if (!box) return;
  $("#jump").innerHTML = REFS.map(r => `<a class="chip" href="#ref-${r.id}">${r.t[lang]}</a>`).join("");
  box.innerHTML = REFS.map(r => `<section class="refsec" id="ref-${r.id}"><h3 class="t">${r.t[lang]}</h3><p class="d">${r.d[lang]}</p>
    <div class="rgrid">${r.items.map(i => `<div class="rc" style="--c:${i.c||"var(--brand)"}">
      ${i.code?`<span class="code">${i.code}</span> `:""}${i.tag?`<span class="tag ${i.tag}">${i.tag==="rej"?(lang==="ar"?"رفض":"Reject"):(lang==="ar"?"إنذار":"Warning")}</span>`:""}
      <b>${i.b[lang]}</b><ul>${i.l.map(x=>`<li>${x[lang]}</li>`).join("")}</ul></div>`).join("")}</div>
    ${r.note?`<div class="note" style="margin-top:12px">${r.note[lang]}</div>`:""}</section>`).join("");
}


/* ---------- encyclopedia sheet ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function openTest(name, push = true){
  const t = TESTS.find(x => x.n === name), e = (lang === "en" && window.ENC_EN && ENC_EN[name]) || (window.ENC && ENC[name]);
  const D = (lang === "en" && window.ENC_EN && ENC_EN[name]) ? "ltr" : "rtl"; curTest = name;
  if (!t || !e) return;
  const L = T[lang], li = a => a.map(x => `<li>${esc(x)}</li>`).join("");
  const col = tubeColor(t.s);
  $("#shBody").innerHTML = `
   <div class="sh-top"><div style="flex:1"><div class="cat">${esc(CATS[t.c]?.en || t.c)}</div><h2>${esc(t.n)}</h2></div><button class="xbtn" id="shX" aria-label="close">✕</button></div>
   <div class="sh-facts">
     <div class="fact"><small>${L.kSample}</small><div class="tube">${col?`<i class="dot" style="background:${col}"></i>`:""}${esc(t.s)}</div></div>
     <div class="fact"><small>${L.kRef}</small><div>${esc(t.r)}</div></div>
     <div class="fact"><small>${L.kUse}</small><div style="font-weight:500">${esc(t.u)}</div></div>
   </div>
   <div class="sh-sec"><h4>${L.encW}</h4><p dir="${D}">${esc(e.w)}</p></div>
   <div class="sh-sec"><h4>${L.encY}</h4><p dir="${D}">${esc(e.y)}</p></div>
   <div class="sh-two" dir="${D}">
     <div class="box"><h4>🧍 ${L.encP}</h4><p style="font-size:14.5px">${esc(e.p)}</p></div>
     <div class="box"><h4>🧪 ${L.encS}</h4><p style="font-size:14.5px">${esc(e.s)}</p></div>
   </div>
   ${(e.h.length||e.l.length)?`<div class="sh-two" dir="${D}">
     ${e.h.length?`<div class="box up"><h4>▲ ${L.encH}</h4><ul>${li(e.h)}</ul></div>`:""}
     ${e.l.length?`<div class="box down"><h4>▼ ${L.encL}</h4><ul>${li(e.l)}</ul></div>`:""}
   </div>`:""}
   ${e.i.length?`<div class="sh-sec" dir="${D}"><div class="note" style="display:block"><b>⚠️ ${L.encI}</b><ul style="margin-top:6px">${li(e.i)}</ul></div></div>`:""}
   ${e.r.length?`<div class="sh-sec"><h4>${L.encR}</h4><div class="rel">${e.r.map(r => `<button class="chip" data-rel="${esc(r)}">${window.ENC[r]?"📖 ":""}${esc(r)}</button>`).join("")}</div></div>`:""}
   <div class="sh-foot"><span>${L.encNote}</span><button class="pill" id="shCopy">🔗 ${L.copyLink}</button></div>`;
  const d = $("#sheet");
  if (!d.open) d.showModal();
  d.scrollTop = 0; $("#shBody").scrollTop = 0;
  if (push) history.replaceState(null, "", "#test/" + slug(name));
  $("#shX").onclick = closeTest;
  $("#shCopy").onclick = async () => { try { await navigator.clipboard.writeText(location.href); $("#shCopy").textContent = L.copied; } catch(err) {} };
  $("#shBody").querySelectorAll("[data-rel]").forEach(b => b.onclick = () => {
    const r = b.dataset.rel;
    if (window.ENC[r]) openTest(r);
    else { closeTest(); cat = "All"; q = r; $("#q").value = r; renderChips(); renderList(); document.querySelector('.tab[data-pane=tests]').click(); }
  });
}
function closeTest(){ curTest = null; const d = $("#sheet"); if (d.open) d.close(); history.replaceState(null, "", location.pathname + location.search); }
function routeHash(){
  const m = location.hash.match(/^#test\/(.+)$/); if (!m) return;
  const t = TESTS.find(x => slug(x.n) === m[1]); if (t) openTest(t.n, false);
}
function initSheet(){
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeTest(); });
$("#sheet").addEventListener("cancel", e => { e.preventDefault(); closeTest(); });
$("#list").addEventListener("click", e => { const c = e.target.closest(".card.has"); if (c) openTest(c.dataset.n); });
$("#list").addEventListener("keydown", e => { if (e.key === "Enter") { const c = e.target.closest(".card.has"); if (c) openTest(c.dataset.n); } });
window.addEventListener("hashchange", routeHash);
}

/* ---------- state ---------- */
let lang = "ar", cat = "All", q = "", shown = 24, curTest = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tubeColor(s){
  s = s.toLowerCase();
  if (s.includes("citrate")) return "#7dd3fc";
  if (s.includes("tan/navy")) return "#1e3a8a";
  if (s.includes("edta") || s.includes("purple")) return "#8b5cf6";
  if (s.includes("grey") || s.includes("naf") || s.includes("fluoride")) return "#6b7280";
  if (s.includes("heparin")) return "#16a34a";
  if (s.includes("yellow") || s.includes("red") || s.includes("serum")) return "#eab308";
  if (s.includes("urine")) return "#fde047";
  return null;
}

function renderChips(){
  const counts = {};
  TESTS.forEach(t => counts[t.c] = (counts[t.c] || 0) + 1);
  const encN = window.ENC ? TESTS.filter(t => ENC[t.n]).length : 0;
  $("#chips").innerHTML = [`<button class="chip ${cat==="All"?"on":""}" data-c="All">${T[lang].all}<small>${TESTS.length}</small></button>`, encN ? `<button class="chip ${cat==="ENC"?"on":""}" data-c="ENC">${T[lang].encOnly}<small>${encN}</small></button>` : ""]
    .concat(Object.keys(CATS).filter(k => counts[k]).map(k =>
      `<button class="chip ${cat===k?"on":""}" data-c="${k}">${CATS[k][lang]}<small>${counts[k]}</small></button>`)).join("");
}

function renderList(){
  const term = q.trim().toLowerCase();
  const f = TESTS.filter(t => (cat === "All" || t.c === cat || (cat === "ENC" && window.ENC && ENC[t.n])) &&
    (!term || [t.n, t.s, t.u, t.c, CATS[t.c]?.ar].join(" ").toLowerCase().includes(term)));
  const L = T[lang];
  $("#count").textContent = L.count(f.length, TESTS.length);
  $("#list").innerHTML = f.length ? f.slice(0, shown).map(t => {
    const col = tubeColor(t.s);
    const has = window.ENC && ENC[t.n];
    return `<article class="card${has?" has":""}"${has?` data-n="${esc(t.n)}" tabindex="0" role="button"`:""}>
      <div class="cat">${esc(CATS[t.c]?.en || t.c)}${has?`<span class="encbadge">📖</span>`:""}</div>
      <h3>${esc(t.n)}</h3>
      <div class="row"><span class="k">${L.kSample}</span><span class="v tube">${col?`<i class="dot" style="background:${col}"></i>`:""}${esc(t.s)}</span></div>
      <div class="row"><span class="k">${L.kRef}</span><span class="v ref">${esc(t.r)}</span></div>
      <div class="row"><span class="k">${L.kUse}</span><span class="v">${esc(t.u)}</span></div>
      ${has?`<div class="more-link">${L.readMore}</div>`:""}
    </article>`;}).join("") : `<div class="empty">${L.empty}</div>`;
  $("#moreBtn").style.display = f.length > shown ? "block" : "none";
}

function renderStatic(){
  const L = T[lang];
  $("#draw").innerHTML = DRAW.map((d,i) => `<div class="step"><div class="cap" style="background:${d.c}"></div><div class="body"></div><span class="n">${i+1}</span><b>${d[lang][0]}</b><small>${d[lang][1]}</small></div>`).join("");
  $("#errors").innerHTML = ERRORS.map((e,i) => `<div class="box"><h3><span class="num">${i+1}</span>${e[lang][0]}</h3><p>${e[lang][1]}</p></div>`).join("");
  $("#safety").innerHTML = SAFETY.map((e,i) => `<div class="box"><h3><span class="num">${i+1}</span>${e[lang][0]}</h3><p>${e[lang][1]}</p></div>`).join("");
  $("#waste").innerHTML = WASTE.map(w => `<div class="bin" style="--c:${w.c}"><b>${w[lang][0]}</b><p>${w[lang][1]}</p></div>`).join("");
  $("#incident").innerHTML = INCIDENT[lang].map(x => `<li>${x}</li>`).join("");
  $("#res").innerHTML = RES.map(r => `<a href="${r.u}" target="_blank" rel="noopener"><div class="box"><div class="dom">${new URL(r.u).hostname.replace("www.","")}</div><h3>${r[lang][0]}</h3><p>${r[lang][1]}</p></div></a>`).join("");
}

function setLang(l){
  lang = l;
  const root = document.documentElement;
  root.lang = l; root.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = T[l][el.dataset.t]; if (typeof v !== "string") return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $("#q").placeholder = T[l].ph;
  $("#langBtn").textContent = T[l].lang;
  try { localStorage.setItem("lang", l); } catch(e) {}
  renderChips(); renderList(); renderStatic(); renderCalc(); renderRef();
  if (curTest && $("#sheet").open) openTest(curTest, false);
}

/* ---------- events ---------- */
$("#q").addEventListener("input", e => { q = e.target.value; shown = 24; renderList(); });
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; shown = 24; renderChips(); renderList(); });
$("#moreBtn").addEventListener("click", () => { shown += 48; renderList(); });
$("#langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.pane));
  window.scrollTo({top: document.querySelector(".tabs").offsetTop - 62, behavior: "smooth"});
}));
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
const lb = $("#lb");
document.querySelectorAll(".gallery img").forEach(img => img.addEventListener("click", () => { lb.querySelector("img").src = img.src; lb.showModal(); }));
lb.addEventListener("click", () => lb.close());

$("#statTests").textContent = TESTS.length;
$("#statCats").textContent = new Set(TESTS.map(t => t.c)).size;
let saved = "ar"; try { saved = localStorage.getItem("lang") || "ar"; } catch(e) {}
setLang(saved);
initSheet();
routeHash();
</script>
</body>
</html>
