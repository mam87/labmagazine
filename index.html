<style>
:root{
  --bg:#f5f7f9;--surface:#ffffff;--surface-2:#eef3f6;--ink:#0b1f33;--ink-2:#46596b;--ink-3:#7a8b9a;
  --line:#dde5eb;--brand:#0e7c7b;--brand-ink:#ffffff;--brand-soft:#e0f2f1;--accent:#c2410c;
  --warn-bg:#fff7ed;--warn-line:#fed7aa;--warn-ink:#9a3412;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a141d;--surface:#111e2a;--surface-2:#172836;--ink:#e8eef3;--ink-2:#a9b8c5;--ink-3:#7d8fa0;
  --line:#22364a;--brand:#2bb3a8;--brand-ink:#04211f;--brand-soft:#0f2f30;--accent:#fb923c;
  --warn-bg:#2a1a0d;--warn-line:#5a3412;--warn-ink:#fdba74;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0a141d;--surface:#111e2a;--surface-2:#172836;--ink:#e8eef3;--ink-2:#a9b8c5;--ink-3:#7d8fa0;
  --line:#22364a;--brand:#2bb3a8;--brand-ink:#04211f;--brand-soft:#0f2f30;--accent:#fb923c;
  --warn-bg:#2a1a0d;--warn-line:#5a3412;--warn-ink:#fdba74;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none;font-size:15px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo i svg{width:18px;height:18px;fill:var(--brand-ink)}
.top .sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--brand)}
/* hero */
.hero{padding:48px 0 28px}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
.hero h1{font-size:clamp(30px,5.5vw,52px);line-height:1.15;margin:16px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--brand)}
.hero p.lead{color:var(--ink-2);font-size:clamp(16px,2.2vw,19px);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
/* tabs */
.tabs{position:sticky;top:62px;z-index:15;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pane{display:none;padding:28px 0 56px}
.pane.on{display:block}
h2{font-size:clamp(22px,3.2vw,28px);margin-bottom:6px}
.sub{color:var(--ink-2);margin-bottom:20px}
/* search */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 46px 14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
[dir="ltr"] .search input{padding:14px 16px 14px 46px}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:16px;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip small{opacity:.7;margin-inline-start:4px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.count{font-size:13px;color:var(--ink-3);margin-bottom:10px}
/* test list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;direction:ltr;text-align:left}
.card h3{font-size:15.5px;line-height:1.35}
.card .cat{font-size:11.5px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.row .k{color:var(--ink-3);min-width:62px;font-size:12px}
.row .v{color:var(--ink)}
.tube{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.ref{font-variant-numeric:tabular-nums;font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:40px}
.more{display:block;margin:18px auto 0;padding:11px 22px}
/* sections */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.box h3{font-size:17px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.box p,.box li{color:var(--ink-2);font-size:14.5px}
.box ul{padding-inline-start:18px;display:grid;gap:6px}
.num{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
/* order of draw */
.draw{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 24px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.step .cap{width:34px;height:14px;border-radius:6px 6px 2px 2px;margin:0 auto}
.step .body{width:26px;height:46px;margin:0 auto 10px;border-radius:0 0 13px 13px;background:linear-gradient(var(--surface-2),var(--surface-2));border:1px solid var(--line);border-top:0}
.step b{display:block;font-size:14px}
.step small{display:block;color:var(--ink-3);font-size:12px;line-height:1.45;margin-top:4px}
.step .n{font-size:11px;font-weight:700;color:var(--brand)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gallery figure{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.gallery img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:var(--surface-2)}
.gallery figcaption{padding:10px 14px;font-size:13.5px;font-weight:600}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,720px)}
dialog::backdrop{background:rgba(5,12,20,.8)}
dialog img{width:100%;border-radius:12px;display:block}
/* waste */
.waste{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bin{border-radius:var(--radius);padding:16px;border:1px solid var(--line);background:var(--surface);border-top:6px solid var(--c)}
.bin b{display:block;margin-bottom:4px}
.bin p{font-size:13.5px;color:var(--ink-2)}
/* resources */
.res a{text-decoration:none;color:inherit;display:block;height:100%}
.res .box{height:100%;transition:border-color .15s}
.res .box:hover{border-color:var(--brand)}
.res .dom{font-size:12px;color:var(--brand);font-weight:600;direction:ltr}
/* footer */
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer .links{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@media (max-width:900px){.draw{grid-template-columns:repeat(3,1fr)}.waste,.grid3,.gallery{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid2,.grid3,.gallery,.waste{grid-template-columns:1fr}.draw{grid-template-columns:1fr 1fr}.hero{padding-top:32px}.logo span{display:none}.list{grid-template-columns:1fr}}
@media print{.top,.tabs,footer,.more{display:none}.pane{display:block!important}}
</style>
</head>

 {ar:["الأدوات الحادة","يُمنع إعادة تغطية الإبر. تخلّص منها فوراً في حاوية الأدوات الحادة ولا تملأها أكثر من ¾."],en:["Sharps","Never recap needles. Discard immediately into a sharps container and never fill it beyond ¾."]},
 {ar:["التطهير","هيبوكلوريت الصوديوم بتخفيف 1:10 من الكلور المنزلي (≈0.5% كلور فعّال، يُحضّر يومياً) للانسكابات الدموية، و70% كحول للأسطح. اغسل يديك بعد خلع القفازات."],en:["Decontamination","Sodium hypochlorite diluted 1:10 from household bleach (≈0.5% available chlorine, prepared daily) for blood spills; 70% alcohol for surfaces. Wash hands after removing gloves."]},
 {ar:["السلامة الكيميائية","افصل الأحماض عن القواعد، واستخدم خزانة الأبخرة مع الفورمالين والزايلين. راقب تركيز الفورمالين في الهواء (حد OSHA: 0.75 ppm خلال 8 ساعات). اعرف مكان غسول العين ودش الطوارئ."],en:["Chemical safety","Store acids and bases apart; use the fume hood for formalin and xylene. Monitor airborne formaldehyde (OSHA PEL 0.75 ppm, 8-h TWA). Know where the eyewash and safety shower are."]},
 {ar:["العينات المعدية","كل عينة تُعامل كمعدية (Standard Precautions). استخدم خزانة السلامة البيولوجية (BSC) لأي عمل يولّد رذاذاً."],en:["Infectious specimens","Treat every specimen as infectious (Standard Precautions). Use a biological safety cabinet for any aerosol-generating work."]},
 {ar:["ممنوعات داخل المختبر","لا أكل ولا شرب ولا مستحضرات تجميل ولا عدسات لاصقة تُعدَّل، ولا تلمس وجهك أثناء العمل."],en:["Prohibited in the lab","No eating, drinking, cosmetics or adjusting contact lenses; do not touch your face while working."]}
];

const WASTE = [
 {c:"#eab308",ar:["أصفر — معدي","قفازات وشاش وأي مادة ملوثة بالدم أو سوائل الجسم"],en:["Yellow — Infectious","Gloves, gauze, anything contaminated with blood or body fluids"]},
 {c:"#f59e0b",ar:["حاوية الأدوات الحادة","إبر، مشارط، شرائح وزجاج مكسور — صلبة ومقاومة للثقب"],en:["Sharps container","Needles, blades, slides and broken glass — rigid, puncture-proof"]},
 {c:"#111827",ar:["أسود — عام","ورق وتغليف غير ملوث"],en:["Black — General","Non-contaminated paper and packaging"]},
 {c:"#2563eb",ar:["حاويات كيميائية مُعلّمة","فورمالين، زايلين، أصباغ — لا تُسكب في المجاري"],en:["Labelled chemical containers","Formalin, xylene, stains — never down the drain"]}
];

const INCIDENT = {
 ar:["اغسل مكان الوخز بالماء والصابون فوراً (العين: ماء جارٍ 15 دقيقة) — لا تعصر الجرح.","أبلغ مشرفك المباشر فوراً.","راجع الصحة المهنية/الطوارئ خلال ساعتين لتقييم الحاجة للوقاية بعد التعرض (PEP).","وثّق الحادث في نموذج تقرير الحوادث وحدد مصدر العينة.","* حسب سياسة المؤسسة الداخلية."],
 en:["Wash the site with soap and water at once (eyes: running water 15 min) — do not squeeze the wound.","Notify your direct supervisor immediately.","See Occupational Health / ED within 2 hours to assess post-exposure prophylaxis (PEP).","Document the incident on the report form and identify the source specimen.","* Subject to institutional policy."]
};

const RES = [
 {u:"https://www.who.int/publications/i/item/9789240011311",ar:["WHO — دليل السلامة البيولوجية","الطبعة الرابعة من دليل منظمة الصحة العالمية لسلامة المختبرات"],en:["WHO Laboratory Biosafety Manual","4th edition of the WHO laboratory biosafety manual"]},
 {u:"https://www.iso.org/standard/76677.html",ar:["ISO 15189:2022","متطلبات الجودة والكفاءة للمختبرات الطبية"],en:["ISO 15189:2022","Quality and competence requirements for medical laboratories"]},
 {u:"https://clsi.org/",ar:["CLSI","معايير إجراءات المختبر مثل GP41 لسحب الدم"],en:["CLSI","Laboratory standards, e.g. GP41 for venipuncture"]},
 {u:"https://www.westgard.com/",ar:["Westgard QC","مرجع ضبط الجودة الداخلي وقواعد Westgard"],en:["Westgard QC","Internal quality control and Westgard rules"]},
 {u:"https://www.labmedica.com/",ar:["LabMedica","أخبار التشخيص المخبري والتقنيات الجديدة"],en:["LabMedica","Clinical lab diagnostics news and new technology"]},
 {u:"https://www.labce.com/",ar:["LabCE","دورات تعليم مستمر لاختصاصيي المختبرات"],en:["LabCE","Continuing education for lab professionals"]}
];

/* ---------- state ---------- */
let lang = "ar", cat = "All", q = "", shown = 24;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tubeColor(s){
  s = s.toLowerCase();
  if (s.includes("citrate")) return "#7dd3fc";
  if (s.includes("tan/navy")) return "#1e3a8a";
  if (s.includes("edta") || s.includes("purple")) return "#8b5cf6";
  if (s.includes("grey") || s.includes("naf") || s.includes("fluoride")) return "#6b7280";
  if (s.includes("heparin")) return "#16a34a";
  if (s.includes("yellow") || s.includes("red") || s.includes("serum")) return "#eab308";
  if (s.includes("urine")) return "#fde047";
  return null;
}

function renderChips(){
  const counts = {};
  TESTS.forEach(t => counts[t.c] = (counts[t.c] || 0) + 1);
  $("#chips").innerHTML = [`<button class="chip ${cat==="All"?"on":""}" data-c="All">${T[lang].all}<small>${TESTS.length}</small></button>`]
    .concat(Object.keys(CATS).filter(k => counts[k]).map(k =>
      `<button class="chip ${cat===k?"on":""}" data-c="${k}">${CATS[k][lang]}<small>${counts[k]}</small></button>`)).join("");
}

function renderList(){
  const term = q.trim().toLowerCase();
  const f = TESTS.filter(t => (cat === "All" || t.c === cat) &&
    (!term || [t.n, t.s, t.u, t.c, CATS[t.c]?.ar].join(" ").toLowerCase().includes(term)));
  const L = T[lang];
  $("#count").textContent = L.count(f.length, TESTS.length);
  $("#list").innerHTML = f.length ? f.slice(0, shown).map(t => {
    const col = tubeColor(t.s);
    return `<article class="card">
      <div class="cat">${esc(CATS[t.c]?.en || t.c)}</div>
      <h3>${esc(t.n)}</h3>
      <div class="row"><span class="k">${L.kSample}</span><span class="v tube">${col?`<i class="dot" style="background:${col}"></i>`:""}${esc(t.s)}</span></div>
      <div class="row"><span class="k">${L.kRef}</span><span class="v ref">${esc(t.r)}</span></div>
      <div class="row"><span class="k">${L.kUse}</span><span class="v">${esc(t.u)}</span></div>
    </article>`;}).join("") : `<div class="empty">${L.empty}</div>`;
  $("#moreBtn").style.display = f.length > shown ? "block" : "none";
}

function renderStatic(){
  const L = T[lang];
  $("#draw").innerHTML = DRAW.map((d,i) => `<div class="step"><div class="cap" style="background:${d.c}"></div><div class="body"></div><span class="n">${i+1}</span><b>${d[lang][0]}</b><small>${d[lang][1]}</small></div>`).join("");
  $("#errors").innerHTML = ERRORS.map((e,i) => `<div class="box"><h3><span class="num">${i+1}</span>${e[lang][0]}</h3><p>${e[lang][1]}</p></div>`).join("");
  $("#safety").innerHTML = SAFETY.map((e,i) => `<div class="box"><h3><span class="num">${i+1}</span>${e[lang][0]}</h3><p>${e[lang][1]}</p></div>`).join("");
  $("#waste").innerHTML = WASTE.map(w => `<div class="bin" style="--c:${w.c}"><b>${w[lang][0]}</b><p>${w[lang][1]}</p></div>`).join("");
  $("#incident").innerHTML = INCIDENT[lang].map(x => `<li>${x}</li>`).join("");
  $("#res").innerHTML = RES.map(r => `<a href="${r.u}" target="_blank" rel="noopener"><div class="box"><div class="dom">${new URL(r.u).hostname.replace("www.","")}</div><h3>${r[lang][0]}</h3><p>${r[lang][1]}</p></div></a>`).join("");
}

function setLang(l){
  lang = l;
  const root = document.documentElement;
  root.lang = l; root.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = T[l][el.dataset.t]; if (typeof v !== "string") return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $("#q").placeholder = T[l].ph;
  $("#langBtn").textContent = T[l].lang;
  try { localStorage.setItem("lang", l); } catch(e) {}
  renderChips(); renderList(); renderStatic();
}

/* ---------- events ---------- */
$("#q").addEventListener("input", e => { q = e.target.value; shown = 24; renderList(); });
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; shown = 24; renderChips(); renderList(); });
$("#moreBtn").addEventListener("click", () => { shown += 48; renderList(); });
$("#langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.pane));
  window.scrollTo({top: document.querySelector(".tabs").offsetTop - 62, behavior: "smooth"});
}));
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
const lb = $("#lb");
document.querySelectorAll(".gallery img").forEach(img => img.addEventListener("click", () => { lb.querySelector("img").src = img.src; lb.showModal(); }));
lb.addEventListener("click", () => lb.close());

$("#statTests").textContent = TESTS.length;
$("#statCats").textContent = new Set(TESTS.map(t => t.c)).size;
let saved = "ar"; try { saved = localStorage.getItem("lang") || "ar"; } catch(e) {}
setLang(saved);
</script>
</body>
</html>
